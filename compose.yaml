# podman compose up  (or docker compose up)
services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: exist
      POSTGRES_PASSWORD: exist
      POSTGRES_DB: exist
    volumes: [dbdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgresql://exist:exist@db:5432/exist
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SECRETS_KEY: ${SECRETS_KEY:-}
      INSTITUTION_TZ: Asia/Kolkata
      INSTITUTION_NAME: ${INSTITUTION_NAME:-Exist Demo College}
      TEACHER_SIGNUP_CODE: ${TEACHER_SIGNUP_CODE:-}
      ATTESTATION_MODE: record
      APK_PATH: /downloads/exist.apk
    volumes:
      # Kept outside the project folder so build containers never relabel it (SELinux).
      - ${HOME}/.local/share/exist/downloads:/downloads:ro,z
volumes:
  dbdata:
