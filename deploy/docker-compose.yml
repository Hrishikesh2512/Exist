# Exist production stack: database, API + dashboard, automatic HTTPS, daily backups.
# Started by setup.sh. Settings live in deploy/.env (created by setup.sh).
services:
  db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: exist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: exist
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exist"]
      interval: 5s
      retries: 20

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://exist:${POSTGRES_PASSWORD}@db:5432/exist
      JWT_SECRET: ${JWT_SECRET}
      SECRETS_KEY: ${SECRETS_KEY}
      INSTITUTION_NAME: ${INSTITUTION_NAME:-}
      TEACHER_SIGNUP_CODE: ${TEACHER_SIGNUP_CODE:-}
      INSTITUTION_TZ: ${INSTITUTION_TZ:-Asia/Kolkata}
      ATTESTATION_MODE: ${ATTESTATION_MODE:-record}
      APK_PATH: /downloads/exist.apk
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./downloads:/downloads:ro,z

  # Automatic HTTPS (free Let's Encrypt certificate) for your domain.
  caddy:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    depends_on: [api]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddydata:/data

  # Daily database backup to deploy/backups, keeping the last 14.
  backup:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups:z
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/exist-$$(date +%Y-%m-%d_%H%M).sql.gz
          pg_dump -h db -U exist exist | gzip > "$$f" && echo "backup: $$f"
          ls -1t /backups/exist-*.sql.gz | tail -n +15 | xargs -r rm -f
          sleep 86400
        done

volumes:
  dbdata:
  caddydata:
